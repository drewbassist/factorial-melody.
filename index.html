<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Factorial Melody</title>
<link rel="stylesheet" href="style.css">
<script src="https://cdn.jsdelivr.net/npm/abcjs@6.4.3/dist/abcjs-basic-min.js"></script>
</head>
<body>
<main class="page">
  <header class="header">
    <div class="eyebrow">GENERATOR PROTOTYPE</div>
    <div class="headrow">
      <div>
        <h1>Factorial Melody</h1>
        <p>24 fixed harmonic positions · 24 rhythms · pentatonic pitch generation</p>
      </div>
      <div class="actions">
        <button id="generate" class="primary">GENERATE</button>
        <button id="rhythms">RANDOMIZE RHYTHMS</button>
        <button id="pentas">SHUFFLE PENTATONICS</button>
      </div>
    </div>
    <div class="rule"></div>
    <div class="subhead">G3–C6 · maximum leap one octave · all five pitch classes used · Measures 6 &amp; 21 improvise</div>
  </header>

  <section class="transport">
    <div class="transport-row">
      <button id="playPause" class="primary">▶ Play</button>
      <button id="stopPlayback">■ Stop</button>
      <span id="transportStatus">Ready</span>
    </div>
    <div class="tempo-row">
      <label for="tempo">Tempo</label>
      <input id="tempo" type="number" min="40" max="240" value="150" step="1">
      <span>BPM</span>
    </div>
  </section>

  <section class="chart-card">
    <div id="notation"></div>
    <div id="notationError" class="notation-error" hidden></div>
  </section>

  <section class="data-card">
    <table>
      <thead><tr><th>Measure</th><th>Chord</th><th>Rhythm</th><th>Transcription</th><th>Pentatonic</th><th>Generated attacks</th></tr></thead>
      <tbody id="output"></tbody>
    </table>
  </section>
</main>
<script src="script.js"></script>
</body>
</html>
