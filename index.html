<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Factorial Melody Prototype</title><link rel="stylesheet" href="style.css"><style>
#score-section{
    margin:20px 0 38px;
    background:#fff;
    overflow-x:auto;
    padding:4px 0 8px;
}
#score{
    width:100%;
    min-width:1120px;
}
#score svg{
    display:block;
    width:100%;
    height:auto;
}
.abcjs-title{
    font-family:Georgia,"Times New Roman",serif !important;

}

</style>

</head><body><main><header><div><small>GENERATOR PROTOTYPE</small><h1>Factorial Melody</h1><p>24 fixed harmonic positions · 24 rhythms · pentatonic pitch generation</p></div><div><button id="generate">GENERATE</button><button id="rhythms">RANDOMIZE RHYTHMS</button><button id="pentas">SHUFFLE PENTATONICS</button></div></header><p class="rules">G3–C6 · maximum leap one octave · all five pitch classes used · Measures 6 & 21 improvise</p>

  <div id="score"></div>
</section>
