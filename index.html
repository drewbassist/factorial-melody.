<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Factorial Melody Prototype</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="page">
  <header class="header">
    <div class="header-copy">
      <div class="eyebrow">GENERATOR PROTOTYPE</div>
      <h1>Factorial Melody</h1>
      <p>24 fixed harmonic positions · 24 rhythms · pentatonic pitch generation</p>
    </div>
    <div class="actions">
      <button id="generate" class="primary" type="button">GENERATE</button>
      <button id="rhythms" type="button">RANDOMIZE RHYTHMS</button>
      <button id="pentas" type="button">SHUFFLE PENTATONICS</button>
    </div>
  </header>

  <div class="rule"></div>
  <div class="subhead">G3–G4 · maximum leap one octave · all five pitch classes used · Measures 6 &amp; 21 improvise</div>

  <section id="transport" aria-label="Playback controls">
    <div id="transport-controls">
      <button id="playPause" class="primary-control" type="button">▶ Play</button>
      <button id="stopPlayback" type="button">■ Stop</button>
      <span id="transport-status">Ready</span>
    </div>
    <div id="tempo-control">
      <label for="tempo">Tempo</label>
      <input id="tempo" type="number" min="40" max="240" step="1" value="150" inputmode="numeric">
      
    </div>
  </section>

  <section id="score-section" aria-label="Generated notation">
    <div id="score"></div>
  </section>

  <table>
    <thead>
      <tr>
        <th>Measure</th>
        <th>Chord</th>
        <th>Rhythm</th>
        <th>Transcription</th>
        <th>Pentatonic</th>
        <th>Generated attacks</th>
      </tr>
    </thead>
    <tbody id="output"></tbody>
  </table>
</main>

<script src="https://cdn.jsdelivr.net/npm/abcjs@6.4.4/dist/abcjs-basic-min.js"></script>
<script src="script.js"></script>
</body>
</html>
